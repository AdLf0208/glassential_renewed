[mod]
id = "glassential"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure glass-registry model (standalone crate lib, injected as
# `crate::game::glassential`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "glassential"
source = "runtime.rs"

# Server-side glue: redstone signal answers and the smart-glass panel state.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "glassential_state"
source = "support.rs"

# The two redstone glasses are signal sources returning 15 on every face.
# The content half is inside this bundle (`data/glassential-content.hmod`, the built
# `content/glassential.hmod`): this writes it to `.horizon-cache/` and appends it to the dev-mod list, so
# one `.hnmod` installs the blocks/items and the code. The registry keeps one file per project, so a
# split port could not be listed; AE2 ships the same pattern (`docs/native-mods.md`, "Data files").
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[injection]]
id = "signal-source"
hook = "is_signal_source"
hook_version = 1
kind = "HEAD"
helper = "signal_source.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "source", ty = "&mut bool", value = "source" },
]

[[injection]]
id = "block-signal"
hook = "block_signal"
hook_version = 1
kind = "HEAD"
helper = "block_signal.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "signal", ty = "&mut i32", value = "signal" },
]

# A block changed or received a neighbour update: dirty the smart-glass panel.
[[injection]]
id = "dirty-block"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "changed.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
]

[[injection]]
id = "dirty-neighbor"
hook = "neighbor_changed"
hook_version = 1
kind = "HEAD"
helper = "changed.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
]

# Rebuild the dirty smart-glass panels after the level tick.
[[injection]]
id = "smart-tick"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]
